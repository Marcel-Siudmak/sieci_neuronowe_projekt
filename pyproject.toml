[project]
name = "sieci-neuronowe-projekt"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*The image decoding and encoding capabilities of TorchVision are deprecated.*:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
